name: workflow-3
on: push
jobs:
    lint:
     runs-on: ubuntu-latest

     steps: 
        - name: Get code
          uses: actions/checkout@v4
        - name: install dependencies
          run: npm ci
        - name: lint
          run: npm run lint
    Test: 
      runs-on: ubuntu-latest
       steps: 
         - name: Test code 
           run: npm run test 

    Build: 
      needs: Test
      runs-on: ubuntu-latest
       steps:       
        - name: Build code
          run: npm run build
        - name: Deploy code
          run: echo "deploying code"